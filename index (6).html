/* Layout: one torchlit stone tablet — title band, HUD plaque, the game screen, then controls. Single dark world by choice. */

}
.wrap { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  color: var(--torch); text-shadow: 0 2px 0 #7a3f12, 0 0 18px rgba(242,163,58,0.35); text-wrap: balance; }
h1 small { display: block; font-family: var(--pixel); font-size: 9px; letter-spacing: 0.18em; color: var(--sand-dim); text-shadow: none; margin-bottom: 8px; }
.top-btns { display: flex; gap: 8px; flex-wrap: wrap; }

button { font: inherit; color: inherit; cursor: pointer; }
.chip { background: var(--slab); border: 2px solid var(--slab-edge); color: var(--sand); border-radius: 6px;

  box-shadow: inset 0 -3px 0 rgba(0,0,0,0.35); }

.chicks-ico i.on { background: #ffd34d; }

/* CRT look on the picture itself: scanlines, phosphor stripes, bloom. No cabinet. */
.screen { position: relative; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; background: #000; margin: 0 auto; }
.screen canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
#cv { filter: none; }
#bloom { filter: blur(2.5px) brightness(1.4) saturate(1.3); mix-blend-mode: screen; opacity: 0.47; pointer-events: none; }
.crt, .crt::before, .crt::after { position: absolute; inset: 0; pointer-events: none; content: ""; }
.crt { z-index: 2; background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.324) 50%); background-size: 100% calc(100% / 192); }
.crt::before { background: repeating-linear-gradient(90deg, rgba(255,40,40,0.068) 0 1px, rgba(40,255,90,0.051) 1px 2px, rgba(60,90,255,0.068) 2px 3px);

@keyframes flicker { 0% { opacity: 0.85; } 100% { opacity: 1; } }
.screen.flat .crt, .screen.flat #bloom { display: none; }

.screen.poweron canvas { animation: poweron 0.7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes poweron { 0% { transform: scale(1, 0.004); filter: brightness(4); } 45% { transform: scale(1, 0.004); filter: brightness(4); } 70% { transform: scale(1, 1.04); filter: brightness(1.8); } 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) { .crt::before { animation: none; } .screen.poweron canvas { animation: none; } }
.toast { z-index: 3; background: #000000 !important; border-color: #ffffff !important; border-radius: 0 !important; color: #ffffff; font-family: var(--display); letter-spacing: 0.02em; position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px);

  border-radius: 4px; padding: 3px 6px; margin-right: 6px; display: inline-block; }

.pad { display: none; justify-content: space-between; align-items: center; gap: 12px; user-select: none; -webkit-user-select: none; touch-action: none;
  padding: 14px 14px 16px; border-radius: 14px; border: 3px solid #120c08;
  background: radial-gradient(circle at 10px 10px, #6b5a48 0 2px, #2a1f18 3px 4px, transparent 5px), radial-gradient(circle at calc(100% - 10px) 10px, #6b5a48 0 2px, #2a1f18 3px 4px, transparent 5px),
    radial-gradient(circle at 10px calc(100% - 10px), #6b5a48 0 2px, #2a1f18 3px 4px, transparent 5px), radial-gradient(circle at calc(100% - 10px) calc(100% - 10px), #6b5a48 0 2px, #2a1f18 3px 4px, transparent 5px),
    linear-gradient(#2d2118, #20170f);
  box-shadow: inset 0 2px 0 rgba(231,201,154,0.1), 0 4px 0 #0c0805; }
.pad button { background: var(--slab); border: 2px solid var(--slab-edge); border-radius: 8px; font-family: var(--display); font-size: 20px;
  -webkit-tap-highlight-color: transparent; touch-action: none; }
.pad button.down { background: var(--slab-edge); border-color: var(--torch); }
.card .eyebrow { font-family: var(--pixel); font-size: 9px; letter-spacing: 0.16em; color: #e6ce80; }
.card p.hint { color: #ffffff; font-size: 16px; line-height: 1.6; text-align: left; }
.card.intro { max-width: 420px; }

.dpad { position: relative; flex: none; }
.dpad .stick { --size: min(124px, 34vw); width: var(--size); height: var(--size); border-radius: 50%; background: #1b130d; border: 4px solid #120c08;
  box-shadow: inset 0 0 0 5px #5e3a1c, inset 0 0 0 7px #a8703a, inset 0 0 0 9px #120c08, 0 0 0 3px #2a1f18, 0 6px 0 3px #0a0706; }
.dpad .stick::before { inset: 16%; clip-path: none; border-radius: 50%; background: #241912; box-shadow: inset 0 0 0 2px #3a2a1c; }

  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.30) 0 1px, rgba(0,0,0,0) 1px 3px), repeating-linear-gradient(90deg, rgba(255,40,40,0.07) 0 1px, rgba(40,255,90,0.05) 1px 2px, rgba(60,90,255,0.07) 2px 3px), radial-gradient(circle at center, transparent 62%, rgba(0,0,0,0.32) 100%); }
.dpad .stick .tick { display: block; color: #7a5a30; font-size: 8px; text-shadow: none; }
.dpad .stick .tick.on { color: #ffd860; text-shadow: none; }

.dpad .stick .knob { width: 56%; height: 56%; margin: -28% 0 0 -28%; border: 3px solid #120c08; box-shadow: 0 4px 0 #0a0706;
  background: radial-gradient(circle at 34% 28%, #fff2a8 0 9%, transparent 10%), radial-gradient(circle at 50% 50%, #ffd860 0 52%, #e0a030 53% 74%, #8a3a1a 75% 100%); }
.dpad .stick .knob::after { display: none; }
.dpad .stick.active { filter: none; }
.dpad .stick.active .knob { box-shadow: 0 2px 0 #0a0706; }
.pad .pickbtn { width: 112px; height: 112px; border-radius: 50%; border: 4px solid #120c08; position: relative;
  background: radial-gradient(circle at 34% 26%, #d8794a 0 10%, transparent 11%), radial-gradient(circle at 50% 50%, #b4502c 0 62%, #8f3b20 63% 84%, #6a2a16 85% 100%);
  box-shadow: 0 0 0 3px #a8703a, 0 0 0 6px #120c08, 0 7px 0 6px #0a0706; }
.pad .pickbtn .px { display: block; width: 84px; height: 84px; }
.pad .pickbtn svg { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.pad .pickbtn.down { transform: translateY(4px); box-shadow: 0 0 0 3px #a8703a, 0 0 0 6px #120c08, 0 3px 0 6px #0a0706; filter: brightness(0.9); }
.pad .pickbtn.down { transform: translateY(4px); box-shadow: inset 0 2px 0 rgba(255,216,96,0.25), 0 1px 0 #0a0706; background: #5a4630; border-color: var(--torch); }
.acts { --bs: 104px; display: grid; grid-template-columns: var(--bs); gap: 12px 22px; align-items: center; justify-items: center; padding: 0 8px; }
.acts button { white-space: nowrap; padding: 0 2px; }
/* 16-bit push buttons: pixel-art sprites (limited palette, dithered shading), no smooth gradients */
.acts .big { width: var(--bs); height: var(--bs); padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; position: relative;
  filter: drop-shadow(0 4px 0 #0a0706); transition: transform 0.06s, filter 0.06s; }
.acts .big .px { position: absolute; inset: 0; display: block; }
.acts .big svg { display: block; width: 100%; height: 100%; image-rendering: pixelated; shape-rendering: crispEdges; }
.acts .big.down { transform: translateY(3px); filter: drop-shadow(0 1px 0 #0a0706) brightness(1.12); }
.stick { --size: 150px; position: relative; width: var(--size); height: var(--size); flex: none; border-radius: 50%;
  background: radial-gradient(circle at 50% 30%, #4a4a52 0, #2b2b32 60%, #1a1a1f 100%); border: 3px solid #0e0e12;
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.14), inset 0 -4px 8px rgba(0,0,0,0.5), 0 5px 0 #08080a, 0 0 0 2px #3a3a44;
  touch-action: none; -webkit-tap-highlight-color: transparent; transition: filter 0.15s; }
/* octagonal restrictor gate, like a real arcade lever */
.stick::before { content: ""; position: absolute; inset: 11px; z-index: 0; pointer-events: none; background: #5a5a64;
  clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
.stick::after { content: ""; position: absolute; inset: 14px; z-index: 0; pointer-events: none; background: radial-gradient(circle, #060608 0, #0d0d11 70%, #16161b 100%);
  clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
.stick .tick { position: absolute; z-index: 1; color: #7d7d8a; font-size: 11px; line-height: 1; pointer-events: none; transition: color 0.1s, text-shadow 0.1s; }

  box-shadow: 0 7px 8px rgba(0,0,0,0.55), inset 0 -5px 8px rgba(0,0,0,0.35), inset 0 2px 3px rgba(255,255,255,0.35); pointer-events: none; will-change: transform; }
.stick .knob::after { content: ""; position: absolute; left: 16%; top: 12%; width: 34%; height: 24%; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,255,255,0.85), rgba(255,255,255,0) 70%); transform: rotate(-28deg); }
.stick.active { filter: brightness(1.08); }
/* undo / restart sit just above the screen */

// ===== 꼬마 탐험가의 유적 : engine with multi-cell stones =====
// Map legend: '#' wall, '%' cracked, 'H' ladder, '^' spikes, 'E' exit, 'P' player, 'C' chick, 'B' beetle,
// 'O' a single cube stone, lowercase letters = cells of one stone (same letter, touching = one stone).
const NONE = 0, LEFT = 1, RIGHT = 2, UP = 3, DOWN = 4, ACT = 5;
const ENEMY_EVERY = 3;
const GATE_PER = 8;   // timed gates flip every 8 ticks
const WOBBLE = 3;

function classify(cells) {
  const key = cells.map(c => c.join(",")).sort().join(";");
  const K = {
    "0,0": "cube", "0,0;0,1": "tall", "0,0;1,0": "long",
    "0,0;1,0;1,1": "giyeok",   // ㄱ : bar on top, leg down on the right
    "0,0;0,1;1,0": "giyeokL",  // ┌ : bar on top, leg down on the left
    "0,0;0,1;1,1": "nieun",    // ㄴ : tall on the left, foot to the right
    "0,1;1,0;1,1": "nieunR",   // ┘ : tall on the right, foot to the left
  };
  return K[key] || "block";
}

function loadLevel(i, L0) {
  const L = L0 || LEVELS[i];
  const H = L.map.length, W = L.map[0].length;
  const s = { W, H, t: [], pieces: [], chicks: [], enemies: [], p: null, tick: 0,
    dead: false, won: false, steps: 0, events: [], keys: 0, hid: [], gp: L.gp || GATE_PER, sw: false, gates: [], plates: [], eggs: 0, gems: 0, eggTotal: 0, gemTotal: 0 };
  const seen = new Set();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = L.map[y][x];
    let tile = c;
    if (c === "P") { s.p = { x, y, face: 1, jump: 0 }; tile = " "; }
    else if (c === "O") { s.pieces.push({ x, y, cells: [[0, 0]], kind: "cube", falling: 0, shake: 0, pushed: 0 }); tile = " "; }
    else if (c >= "a" && c <= "z") {
      tile = " ";
      if (!seen.has(x + "," + y)) {
        const stack = [[x, y]], cells = [];
        seen.add(x + "," + y);
        while (stack.length) {
          const [cx, cy] = stack.pop(); cells.push([cx, cy]);
          for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nx = cx + dx, ny = cy + dy;
            if (ny >= 0 && ny < H && nx >= 0 && nx < W && L.map[ny][nx] === c && !seen.has(nx + "," + ny)) { seen.add(nx + "," + ny); stack.push([nx, ny]); }
          }
        }
        const mx = Math.min(...cells.map(q => q[0])), my = Math.min(...cells.map(q => q[1]));
        const rel = cells.map(([a, b]) => [a - mx, b - my]).sort((p, q) => p[1] - q[1] || p[0] - q[0]);
        s.pieces.push({ x: mx, y: my, cells: rel, kind: classify(rel), falling: 0, shake: 0, pushed: 0 });
      }
    }
    else if (c === "Z") { s.hid.push(y * W + x); tile = "%"; }   // a cracked stone with a key buried inside
    else if (c === "C") { s.chicks.push({ x, y, got: false }); tile = " "; }
    else if (c === "B") { s.enemies.push({ x, y, d: -1, alive: true, t: "B", hp: 1, stun: 0 }); tile = " "; }
    else if (c === "M") { s.enemies.push({ x, y, d: -1, alive: true, t: "M", hp: 2, stun: 0 }); tile = " "; }   // centipede: two pickaxe hits
    else if (c === "U") { s.enemies.push({ x, y, d: -1, alive: true, t: "U", hp: 1, stun: 0 }); tile = " "; }   // white ghost: pickaxe passes through it, a falling stone dispels it
    else if (c === "V") { s.enemies.push({ x, y, d: -1, alive: true, t: "V", hp: 1, stun: 0 }); tile = " "; }   // fast ant: one hit
    else if (c === "G") s.gates.push({ x, y, k: "A" });      // gate opened while a pressure plate is pressed
    else if (c === "X") s.gates.push({ x, y, k: "B" });      // gate opened by the lever
    else if (c === "T") s.gates.push({ x, y, k: "C", ph: 1 }); // timed gate, starts closed
    else if (c === "Y") { s.gates.push({ x, y, k: "C", ph: 0 }); tile = ","; } // timed gate, starts open
    else if (c === "=") s.plates.push({ x, y });
    else if (c === "D") s.pa = { x, y };    // locked portal door, end A
    else if (c === "W") s.pb = { x, y };    // locked portal door, end B
    else if (c === "N") s.eggTotal++;       // optional egg pickup
    else if (c === "J") s.gemTotal++;       // optional gem pickup
    s.t.push(tile);
  }
  buildOcc(s);
  return s;
}

function clone(s) {
  const n = { W: s.W, H: s.H, t: s.t.slice(), tick: s.tick, dead: s.dead, won: s.won, steps: s.steps, events: [],
    pa: s.pa || null, pb: s.pb || null, hid: s.hid || [], gp: s.gp || GATE_PER, keys: s.keys || 0, sw: !!s.sw, gates: s.gates || [], plates: s.plates || [], eggs: s.eggs || 0, gems: s.gems || 0, opened: !!s.opened, eggTotal: s.eggTotal || 0, gemTotal: s.gemTotal || 0,
    p: { ...s.p }, pieces: s.pieces.map(b => ({ ...b })), chicks: s.chicks.map(c => ({ ...c })),
    enemies: s.enemies.map(e => ({ ...e })) };
  buildOcc(n);
  return n;
}

function buildOcc(s) {
  const o = new Int16Array(s.W * s.H).fill(-1);
  s.pieces.forEach((p, i) => { for (const [dx, dy] of p.cells) o[(p.y + dy) * s.W + p.x + dx] = i; });
  s.occ = o;
}

const T = (s, x, y) => (x < 0 || y < 0 || x >= s.W || y >= s.H) ? "#" : s.t[y * s.W + x];
const setT = (s, x, y, v) => { s.t[y * s.W + x] = v; };
const pieceAt = (s, x, y) => (x < 0 || y < 0 || x >= s.W || y >= s.H) ? -1 : s.occ[y * s.W + x];
const chickAt = (s, x, y) => s.chicks.find(c => !c.got && c.x === x && c.y === y);
const enemyAt = (s, x, y) => s.enemies.find(e => e.alive && e.x === x && e.y === y);

// one simple picture per stage: its defining feature
function stageIcon(i) {
  const cnt = {}; for (const r of LEVELS[i].map) for (const ch of r) cnt[ch] = (cnt[ch] || 0) + 1;
  const n = c => cnt[c] || 0;
  if (n("F")) return "plank";
  if (n("T") || n("Y") || n("G")) return "bars";
  if (n("D") || n("W") || n("Z")) return "key";
  if (n("B") || n("M") || n("V") || n("U")) return "beetle";
  if (n("^") >= 4) return "spike";
  if (n("%") >= 4) return "crack";
  if (n("O")) return "stone";
  return "chick";
}
const COIN_ICON = `<svg viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="0" width="4" height="1" fill="#1a1210"/><rect x="2" y="1" width="1" height="1" fill="#1a1210"/><rect x="7" y="1" width="1" height="1" fill="#1a1210"/><rect x="1" y="2" width="1" height="6" fill="#1a1210"/><rect x="8" y="2" width="1" height="6" fill="#1a1210"/><rect x="2" y="8" width="1" height="1" fill="#1a1210"/><rect x="7" y="8" width="1" height="1" fill="#1a1210"/><rect x="3" y="9" width="4" height="1" fill="#1a1210"/><rect x="2" y="2" width="6" height="6" fill="#f08a2a"/><rect x="3" y="1" width="4" height="8" fill="#f08a2a"/><rect x="3" y="2" width="4" height="6" fill="#ffd860"/><rect x="4" y="3" width="2" height="4" fill="#f08a2a"/><rect x="3" y="2" width="1" height="2" fill="#fff"/></svg>`;

// ---------- input ----------
const DIAG = { KeyQ: LEFT, KeyE: RIGHT };
const KEYMAP = { ArrowLeft: LEFT, KeyA: LEFT, ArrowRight: RIGHT, KeyD: RIGHT, ArrowUp: UP, KeyW: UP, ArrowDown: DOWN, KeyS: DOWN, Space: ACT, KeyX: ACT };
function press(k) {
  audio();
  if (k === ACT) actHeld = true;
  if (mode !== "play") return;
  const last = queue[queue.length - 1];
  if (k === ACT && queue.includes(DOWN)) return;                      // ↓ then Space in the same moment: one dig
  if (k === DOWN && last === ACT) { queue[queue.length - 1] = DOWN; if (!held.includes(DOWN)) held.push(DOWN); return; }
  if (k === UP && (last === LEFT || last === RIGHT) && queue.length === 1) queue.unshift(UP); // ↑ pressed right after ← → : diagonal
  else if (queue.length < 2) queue.push(k);
  if (k !== ACT && !held.includes(k)) held.push(k);
}
function pressDiag(d) {
  audio();
  if (mode !== "play") return;
  queue.length = 0; queue.push(UP, d);
  if (!held.includes(UP)) held.push(UP);
  if (!held.includes(d)) held.push(d);
}
function release(k) { if (k === ACT) actHeld = false; const i = held.indexOf(k); if (i >= 0) held.splice(i, 1); }
window.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, select, textarea")) return;
  if (!$("rankPage").hidden) { if (e.code === "Escape" && rankKind !== "clear") hideRank(); return; }
  if (e.target.closest && e.target.closest("button") && (e.code === "Space" || e.code === "Enter") && !overlay.hidden) return;
  if (mode === "intro") {
    if (KEYMAP[e.code] || DIAG[e.code] || e.code === "Enter" || e.code === "Escape") { e.preventDefault(); if (!e.repeat) closeIntro(); }
    return;
  }
  if (e.code === "KeyZ") { e.preventDefault(); undo(); return; }
  if (e.code === "KeyR") { e.preventDefault(); reset(); return; }
  if (e.code === "Enter" && mode === "dead") { e.preventDefault(); continueRun(); return; }
  if (e.code === "Enter" && mode === "won" && !run.done && !(overlay.hidden)) { e.preventDefault(); startLevel(nextTarget()); return; }
  if (DIAG[e.code]) { e.preventDefault(); if (!e.repeat) pressDiag(DIAG[e.code]); return; }
  const k = KEYMAP[e.code];
  if (k) { e.preventDefault(); if (!e.repeat) press(k); }
});
window.addEventListener("keyup", e => {
  if (DIAG[e.code]) { release(UP); release(DIAG[e.code]); return; }
  const k = KEYMAP[e.code]; if (k) release(k);
});
window.addEventListener("blur", () => { held.length = 0; actHeld = false; });

const PADMAP = { left: LEFT, right: RIGHT, up: UP, down: DOWN, act: ACT };
document.querySelectorAll(".pad button, .utl button").forEach(btn => {
  const k = btn.dataset.k;
  btn.addEventListener("pointerdown", e => {
    e.preventDefault(); btn.classList.add("down"); audio(); try { navigator.vibrate && navigator.vibrate(8); } catch (_) {}
    if (mode === "intro") { closeIntro(); return; }
    if (k === "undo") return undo(); if (k === "reset") return reset();
    try { btn.setPointerCapture(e.pointerId); } catch (_) {}
    // a tap = exactly one step; only a longer press (REPEAT ms) keeps walking
    const REPEAT = 260;
    const keys = k === "upleft" ? [UP, LEFT] : k === "upright" ? [UP, RIGHT] : [PADMAP[k]];
    const fire = () => {
      if (keys.length === 2) pressDiag(keys[1]); else press(keys[0]);
      if (keys[0] !== ACT) keys.forEach(release);              // not "held" yet
      btn._r = setTimeout(() => { btn._r = 0; if (btn.classList.contains("down") && mode === "play") keys.forEach(q => { if (q !== ACT && !held.includes(q)) held.push(q); }); }, REPEAT);
    };
    if (k === "act") press(ACT);
    else if ((k === "left" || k === "right") && !held.includes(UP)) {
      // short window so that ▲ then ◀/▶ and ◀/▶ then ▲ both give the same jump
      btn._t = setTimeout(() => { btn._t = 0; fire(); }, 70);
    } else fire();
  });
  const up = () => {
    const was = btn.classList.contains("down");
    btn.classList.remove("down");
    if (btn._r) { clearTimeout(btn._r); btn._r = 0; }
    if (btn._t) { clearTimeout(btn._t); btn._t = 0; press(PADMAP[k]); release(PADMAP[k]); return; }
    if (k === "upleft" || k === "upright") { release(UP); release(k === "upleft" ? LEFT : RIGHT); }
    else if (PADMAP[k]) release(PADMAP[k]);
  };
  btn.addEventListener("pointerup", up); btn.addEventListener("pointercancel", up); btn.addEventListener("lostpointercapture", up);
  btn.addEventListener("contextmenu", e => e.preventDefault());
});

// ---------- thumbstick ----------
const stick = document.getElementById("stick"), knob = document.getElementById("knob"), shaft = document.getElementById("shaft");
let stickId = null, stickDirs = [], stickOx = 0, stickOy = 0;   // origin follows the thumb: the first touch point is the neutral position
function stickSet(dirs) {
  // dirs: e.g. [LEFT], [UP, RIGHT] (diagonal jump), [DOWN]
  const add = dirs.filter(d => !stickDirs.includes(d)), gone = stickDirs.filter(d => !dirs.includes(d));
  gone.forEach(release);
  if (add.includes(UP) && dirs.length === 2) pressDiag(dirs[1]);       // pushed into an upper diagonal
  else add.forEach(press);
  stickDirs = dirs;
  stick.querySelectorAll(".tick").forEach(t => t.classList.toggle("on",

    clear: ["ALL CLEAR", "전체 클리어!", "clear", `30개 스테이지 클리어 · 기록 <b>${fmtTime(run.ms)}</b>`],
    view: ["RANKING", "전체 클리어 순위", "", "목숨 5개로 30개 스테이지를 모두 클리어한 시간 순위예요."]
  }[kind];
  $("rkEye").textContent = T[0]; const h = $("rkTitle"); h.textContent = T[1]; h.className = T[2]; $("rkMsg").innerHTML = T[3];
  rkNew.hidden = kind === "view";
  rkNick.value = nickname;
  rkForm.hidden = kind === "clear" && nickname ? true : !(kind === "clear" && !run.sent);
  rkNew.textContent = "다시하기"; $("rkClose").hidden = kind === "clear";
  rankPage.hidden = false;
  (async () => {
    try { if (kind === "clear" && nickname && !run.sent) { rkNote.textContent = "기록을 올리는 중…"; if (await submitRun()) { rkForm.hidden = true; loadBoard(); } } } catch (_) {}
    try { await loadRank(); } catch (_) {}
  })();
  setTimeout(() => { try { (rkForm.hidden ? $("rkClose") : rkNick).focus({ preventScroll: true }); } catch (_) {} }, 50);
}
function hideRank() {
  rankPage.hidden = true;
  if (mode === "paused") { mode = "play"; lastTick = performance.now(); }
}
$("rankBtn").addEventListener("click", () => { audio(); openRank("view"); });
$("rkClose").addEventListener("click", hideRank);
rkNew.addEventListener("click", () => newRun());
rkForm.addEventListener("submit", async e => {
  e.preventDefault();
  const v = rkNick.value.trim().slice(0, 12);
  if (!v) { rkNote.textContent = "닉네임을 한 글자 이상 적어 주세요."; return; }
  nickname = v; store.set("nick", v); nickInput.value = v;
  saveLocalRun();
  rkNote.textContent = "기록을 올리는 중…";
  if (await submitRun()) { rkForm.hidden = true; loadBoard(); }
  loadRank();
});
if (sb) {
  boardEl.hidden = false;
  nickInput.value = nickname;
  $("nickForm").addEventListener("submit", async e => {
    e.preventDefault();
    const v = nickInput.value.trim().slice(0, 12);
    if (!v) { boardNote.textContent = "닉네임을 한 글자 이상 적어 주세요."; return; }
    nickname = v; store.set("nick", v); try { document.activeElement.blur(); } catch (_) {}
    showToast(`닉네임을 "${v}"(으)로 저장했어요. 전체 클리어 기록이 순위에 올라가요.`, 2600);
    if (run && run.done && !run.sent) await submitRun();
    loadBoard();
  });
  loadBoard();
}

// ---------- integer pixel scaling (every game pixel = same number of device pixels) ----------
const screenEl = document.getElementById("screen");
function fitScreen() {
  if (!screenEl.parentElement) return;
  const avail = screenEl.parentElement.clientWidth;
  const dpr = window.devicePixelRatio || 1;
  const k = Math.max(1, Math.floor(avail * dpr / 256));
  let w = 256 * k / dpr;
  if (w < avail * 0.9 || avail <= 640) w = avail;   // small phones: fill the width instead of leaving wide gutters (a touch softer, much easier to see)
  screenEl.style.width = w + "px";
}
try { new ResizeObserver(fitScreen).observe(screenEl.parentElement); } catch (e) { window.addEventListener("resize", fitScreen); }
fitScreen();

// ---------- boot ----------
function boot() {
  const saved = store.get("run", null);
  if (saved && !saved.done && saved.lives > 0) {
    run = saved; run.cl = LEVELS.map((_, i) => saved.cl && saved.cl[i] ? 1 : 0); run.ms = +run.ms || 0;
  } else { run = freshRun(); saveRun(); }
  startLevel(Math.min(Math.max(run.level | 0, 0), LEVELS.length - 1));
  lastTick = performance.now();
  requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange", () => { if (document.hidden && run) saveRun(); });
window.addEventListener("pagehide", () => { if (run) saveRun(); });
const _startLevel = startLevel;
startLevel = (i, o) => { store.set("last", i); if (run) { run.level = i; saveRun(); } _startLevel(i, o); if (!(o && o.bonus >= 0)) startExplorer(); };
try { window.claude?.hot?.snapshot?.(() => ({ level })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(() => boot()) : boot();
})();
</script>
